<!-- og.svg — OpenExpertise social preview card (Open Graph / Twitter Card)
     Dimensions: 1200×630 (standard OG image size)
     Brand palette: indigo #6366f1 → fuchsia #a855f7 (matches custom.css)

     To convert to PNG for scrapers that don't handle SVG:
       rsvg-convert -h 630 og.svg > og.png
     or:
       magick convert og.svg og.png
     or use Inkscape, Figma, or any browser's "save as image" feature.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"
     role="img" aria-label="OpenExpertise — AI-era Makefile social preview card">

  <defs>
    <!-- Main background gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="60%" stop-color="#1a1040"/>
      <stop offset="100%" stop-color="#2d0b4e"/>
    </linearGradient>

    <!-- Brand accent gradient for text -->
    <linearGradient id="brand-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <!-- DAG node fill -->
    <linearGradient id="node-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow filter for title -->
    <filter id="text-glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle grid pattern overlay -->
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(99,102,241,0.07)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Subtle grid overlay -->
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Top accent bar: indigo → fuchsia -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#brand-grad)"/>

  <!-- Large decorative circle (background glow) -->
  <circle cx="850" cy="320" r="280" fill="rgba(99,102,241,0.06)"/>
  <circle cx="850" cy="320" r="180" fill="rgba(168,85,247,0.05)"/>

  <!-- ===== LEFT SIDE: Title + Subtitle ===== -->

  <!-- "OpenExpertise" main title -->
  <text x="72" y="176"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="80" font-weight="800" letter-spacing="-2"
        fill="url(#brand-grad)" filter="url(#text-glow)">OpenExpertise</text>

  <!-- Tagline line 1 -->
  <text x="72" y="236"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="28" font-weight="400" fill="rgba(226,232,240,0.9)">AI-era Makefile — codify expert workflows</text>

  <!-- Tagline line 2 -->
  <text x="72" y="272"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="28" font-weight="400" fill="rgba(226,232,240,0.9)">as YAML graphs</text>

  <!-- Feature pills row 1 -->
  <!-- Pill 1: Deterministic flow -->
  <rect x="72" y="310" width="220" height="36" rx="18" fill="rgba(99,102,241,0.22)" stroke="rgba(99,102,241,0.4)" stroke-width="1"/>
  <text x="182" y="334" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15" fill="#a5b4fc">Deterministic flow</text>

  <!-- Pill 2: 6 node kinds -->
  <rect x="304" y="310" width="180" height="36" rx="18" fill="rgba(99,102,241,0.22)" stroke="rgba(99,102,241,0.4)" stroke-width="1"/>
  <text x="394" y="334" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15" fill="#a5b4fc">6 node kinds</text>

  <!-- Pill 3: Self-evolving -->
  <rect x="72" y="358" width="160" height="36" rx="18" fill="rgba(168,85,247,0.22)" stroke="rgba(168,85,247,0.4)" stroke-width="1"/>
  <text x="152" y="382" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15" fill="#c084fc">Self-evolving</text>

  <!-- Pill 4: Multi-vendor LLM -->
  <rect x="244" y="358" width="210" height="36" rx="18" fill="rgba(168,85,247,0.22)" stroke="rgba(168,85,247,0.4)" stroke-width="1"/>
  <text x="349" y="382" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15" fill="#c084fc">Multi-vendor LLM CLI</text>

  <!-- Code snippet teaser -->
  <rect x="72" y="420" width="460" height="100" rx="8" fill="rgba(15,15,26,0.8)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
  <text x="96" y="449"
        font-family="ui-monospace, 'SF Mono', Monaco, Menlo, monospace"
        font-size="14" fill="#a5b4fc">$ oe run examples/review-branch</text>
  <text x="96" y="469"
        font-family="ui-monospace, 'SF Mono', Monaco, Menlo, monospace"
        font-size="14" fill="#22c55e">✓ run finished · 4 issues found · risk: 0.85</text>
  <text x="96" y="489"
        font-family="ui-monospace, 'SF Mono', Monaco, Menlo, monospace"
        font-size="14" fill="#64748b">$ oe evolve run-2026-…  # graph improves itself</text>

  <!-- ===== RIGHT SIDE: DAG illustration ===== -->
  <!-- Centered around x=900, y=310 -->

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="rgba(99,102,241,0.7)"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="rgba(34,197,94,0.8)"/>
    </marker>
  </defs>

  <!-- Node: tool (top-left of DAG) at (780, 200) -->
  <rect x="720" y="178" width="120" height="44" rx="8" fill="url(#node-grad)" stroke="rgba(99,102,241,0.5)" stroke-width="1.5"/>
  <text x="780" y="205" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Monaco, Menlo, monospace"
        font-size="14" font-weight="600" fill="#c7d2fe">tool</text>

  <!-- Node: agent (top-right of DAG) at (940, 200) -->
  <rect x="880" y="178" width="120" height="44" rx="8" fill="url(#node-grad)" stroke="rgba(168,85,247,0.5)" stroke-width="1.5"/>
  <text x="940" y="205" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Monaco, Menlo, monospace"
        font-size="14" font-weight="600" fill="#c084fc">agent</text>

  <!-- Node: cli-agent (center) at (860, 290) -->
  <rect x="796" y="268" width="128" height="44" rx="8" fill="rgba(30,27,75,0.95)" stroke="rgba(34,197,94,0.6)" stroke-width="1.5"/>
  <text x="860" y="295" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Monaco, Menlo, monospace"
        font-size="13" font-weight="600" fill="#86efac">cli-agent</text>

  <!-- Node: dataset (bottom-left) at (770, 380) -->
  <rect x="710" y="358" width="120" height="44" rx="8" fill="url(#node-grad)" stroke="rgba(96,165,250,0.5)" stroke-width="1.5"/>
  <text x="770" y="385" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Monaco, Menlo, monospace"
        font-size="13" font-weight="600" fill="#93c5fd">dataset</text>

  <!-- Node: skill (bottom-right) at (950, 380) -->
  <rect x="890" y="358" width="120" height="44" rx="8" fill="url(#node-grad)" stroke="rgba(251,191,36,0.5)" stroke-width="1.5"/>
  <text x="950" y="385" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Monaco, Menlo, monospace"
        font-size="13" font-weight="600" fill="#fcd34d">skill</text>

  <!-- Node: experience (bottom-center) at (860, 470) -->
  <rect x="796" y="448" width="128" height="44" rx="8" fill="rgba(49,46,129,0.9)" stroke="url(#brand-grad)" stroke-width="1.5"/>
  <text x="860" y="475" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Monaco, Menlo, monospace"
        font-size="13" font-weight="600" fill="url(#brand-grad)">experience</text>

  <!-- DAG edges -->
  <!-- tool → cli-agent -->
  <line x1="780" y1="222" x2="840" y2="268" stroke="rgba(99,102,241,0.55)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- agent → cli-agent -->
  <line x1="940" y1="222" x2="880" y2="268" stroke="rgba(99,102,241,0.55)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- cli-agent → dataset -->
  <line x1="820" y1="312" x2="780" y2="358" stroke="rgba(99,102,241,0.55)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- cli-agent → skill -->
  <line x1="904" y1="312" x2="940" y2="358" stroke="rgba(99,102,241,0.55)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- dataset → experience -->
  <line x1="770" y1="402" x2="830" y2="448" stroke="rgba(34,197,94,0.6)" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <!-- skill → experience -->
  <line x1="950" y1="402" x2="892" y2="448" stroke="rgba(34,197,94,0.6)" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- DAG label -->
  <text x="860" y="168" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="13" fill="rgba(148,163,184,0.7)">6 heterogeneous node kinds · one graph</text>

  <!-- ===== BOTTOM STRIP ===== -->
  <line x1="0" y1="570" x2="1200" y2="570" stroke="rgba(99,102,241,0.2)" stroke-width="1"/>

  <!-- Bottom-left: badge row -->
  <text x="72" y="600"
        font-family="ui-monospace, 'SF Mono', Monaco, Menlo, monospace"
        font-size="14" fill="#4ade80">✓ 227 tests</text>
  <text x="196" y="600"
        font-family="ui-monospace, 'SF Mono', Monaco, Menlo, monospace"
        font-size="14" fill="#64748b"> · </text>
  <text x="214" y="600"
        font-family="ui-monospace, 'SF Mono', Monaco, Menlo, monospace"
        font-size="14" fill="#60a5fa">strict TypeScript</text>
  <text x="374" y="600"
        font-family="ui-monospace, 'SF Mono', Monaco, Menlo, monospace"
        font-size="14" fill="#64748b"> · </text>
  <text x="392" y="600"
        font-family="ui-monospace, 'SF Mono', Monaco, Menlo, monospace"
        font-size="14" fill="#c084fc">MIT license</text>

  <!-- Bottom-right: repo + version -->
  <text x="1128" y="600" text-anchor="end"
        font-family="ui-monospace, 'SF Mono', Monaco, Menlo, monospace"
        font-size="14" fill="rgba(148,163,184,0.6)">github.com/xingchengxu/OpenExpertise · v0.1.0</text>

</svg>
